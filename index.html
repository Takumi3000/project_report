<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Отчеты по проектам</title>
    
    <!-- Tailwind CSS CDN & Lucide Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 500: '#3b82f6', 600: '#2563eb' }
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- PWA Настройки -->
    <link rel="manifest" href="./manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#090d16">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='120' fill='%23090d16'/><rect x='128' y='128' width='256' height='256' rx='40' fill='none' stroke='%233b82f6' stroke-width='32'/><path d='M180 256l50 50 102-102' fill='none' stroke='%233b82f6' stroke-width='32' stroke-linecap='round' stroke-linejoin='round'/></svg>">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        /* Печатные стили с сохранением ТЁМНОЙ ТЕМЫ */
        @media print {
            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            .no-print { display: none !important; }
            body { 
                background-color: #090d16 !important; 
                color: #f4f4f5 !important; 
                padding-bottom: 0 !important; 
            }
            .print-card { 
                border: 1px solid #27272a !important; 
                background-color: #18181b !important; 
                box-shadow: none !important; 
            }
            .print-accordion-content { display: block !important; }
            input, select, textarea { 
                border: none !important; 
                background: transparent !important; 
                color: #f4f4f5 !important;
                appearance: none !important; 
            }
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.2); border-radius: 99px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(156, 163, 175, 0.4); }

        .drag-over {
            border-color: #3b82f6 !important;
            background-color: rgba(59, 130, 246, 0.15) !important;
        }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex flex-col pb-16 antialiased selection:bg-blue-500/20">

    <!-- Top Header -->
    <header class="border-b border-zinc-800/80 bg-zinc-900/50 backdrop-blur-md sticky top-0 z-30 no-print">
        <div class="max-w-7xl mx-auto px-4 sm:px-8 py-3.5 flex items-center justify-between gap-2">
            
            <div class="flex items-center gap-3">
                <div class="p-2 rounded-xl bg-blue-500/10 text-blue-500 border border-blue-500/20">
                    <i data-lucide="clapperboard" class="w-5 h-5"></i>
                </div>
                <h1 class="text-lg font-semibold tracking-tight">T.REPORT</h1>
                <span id="syncBadge" class="hidden text-[10px] uppercase font-semibold tracking-wider px-2 py-0.5 rounded bg-emerald-500/10 text-emerald-500 border border-emerald-500/20 flex items-center gap-1.5">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
                    Облако
                </span>
            </div>

            <div class="flex items-center gap-2">
                <!-- Sync Trigger -->
                <button id="openSyncModalBtn" class="flex items-center gap-1.5 text-xs font-medium px-3 py-2 rounded-xl border border-zinc-800 hover:bg-zinc-800 transition-all text-zinc-300 whitespace-nowrap">
                    <i data-lucide="cloud" class="w-4 h-4 text-zinc-400"></i>
                    <span id="syncBtnLabel" class="whitespace-nowrap">Синхронизация</span>
                </button>

                <!-- Export PDF -->
                <button onclick="window.print()" class="flex items-center gap-1.5 px-3.5 py-2 text-xs font-medium rounded-xl bg-blue-600 hover:bg-blue-500 text-white transition-colors shadow-lg shadow-blue-500/20">
                    <i data-lucide="printer" class="w-4 h-4"></i>
                    <span>Экспорт в PDF</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl w-full mx-auto px-4 sm:px-8 py-8 flex-grow">
        
        <!-- Project Header Info -->
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8 pb-5 border-b border-zinc-800/60">
            <div>
                <div class="flex items-center gap-3">
                    <h2 id="currentProjectTitle" class="text-2xl sm:text-3xl font-bold tracking-tight text-white">Загрузка...</h2>
                    <button id="deleteProjectBtn" class="no-print p-1.5 text-zinc-500 hover:text-red-400 transition-colors" title="Удалить данный лист">
                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                    </button>
                </div>
                <p class="text-sm text-zinc-400 mt-1" id="projectStats">Всего видео: 0</p>
            </div>

            <button id="addMonthBtn" class="no-print self-start sm:self-auto flex items-center gap-2 px-4 py-2.5 bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 rounded-xl text-xs sm:text-sm font-medium text-zinc-200 transition-colors">
                <i data-lucide="calendar-plus" class="w-4 h-4 text-blue-400"></i>
                <span>Добавить месяц</span>
            </button>
        </div>

        <!-- Months Accordion Container -->
        <div id="monthsContainer" class="space-y-6">
            <!-- Rendered dynamically -->
        </div>

    </main>

    <!-- Bottom Sheets / Project Navigation -->
    <footer class="border-t border-zinc-800 bg-zinc-900/90 backdrop-blur-md fixed bottom-0 left-0 right-0 z-40 no-print">
        <div class="max-w-7xl mx-auto px-4 sm:px-8 flex items-center justify-between">
            
            <!-- Tabs list (Excel style) -->
            <nav id="projectsTabs" class="flex items-center gap-1.5 overflow-x-auto custom-scrollbar py-2.5">
                <!-- Rendered dynamically -->
            </nav>

            <button id="addProjectBtn" class="flex items-center gap-1.5 px-3.5 py-1.5 text-xs font-medium rounded-lg bg-zinc-800 hover:bg-zinc-700 text-zinc-200 transition-colors shrink-0 ml-3">
                <i data-lucide="plus" class="w-3.5 h-3.5"></i>
                <span>Лист</span>
            </button>
        </div>
    </footer>

    <!-- Sync Modal -->
    <div id="syncModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-200 no-print">
        <div class="bg-zinc-900 border border-zinc-800 w-full max-w-md rounded-2xl p-6 shadow-2xl relative space-y-5">
            
            <div class="flex justify-between items-center">
                <h3 class="text-base font-semibold text-zinc-100">Синхронизация через Облако</h3>
                <button id="closeSyncModalBtn" class="text-zinc-400 hover:text-zinc-200">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <div class="space-y-3">
                <p class="text-xs text-zinc-400 leading-relaxed">
                    Введите одинаковый <strong>Синхро-код</strong> на всех ваших устройствах (ноутбук, телефон), чтобы отчеты обновлялись в реальном времени!
                </p>
                <div class="flex gap-2">
                    <input 
                        type="text" 
                        id="syncCodeInput" 
                        placeholder="Код (например: айдай)"
                        class="flex-grow bg-zinc-950 border border-zinc-800 text-xs sm:text-sm rounded-xl px-3.5 py-2.5 outline-none focus:border-blue-500 font-mono text-zinc-100"
                    >
                    <button id="applySyncCodeBtn" class="px-4 py-2.5 bg-blue-600 text-white hover:bg-blue-500 transition-opacity rounded-xl text-xs font-medium">
                        Подключить
                    </button>
                </div>
            </div>

            <div class="pt-3 border-t border-zinc-800 flex justify-between items-center text-xs text-zinc-400">
                <span>Статус подключения:</span>
                <span id="modalStatusText" class="font-medium text-emerald-400">Локальный режим</span>
            </div>

        </div>
    </div>

    <!-- Hidden File Input -->
    <input type="file" id="globalFileInput" accept="image/*" class="hidden">

    <!-- Firebase & App Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyD9-FySSKcaU-djgAXHmmi7DQoHIHNOY24",
            authDomain: "task-task-70067.firebaseapp.com",
            projectId: "task-task-70067",
            storageBucket: "task-task-70067.firebasestorage.app",
            messagingSenderId: "19699022007",
            appId: "1:19699022007:web:b678be866ae4cf3689b532",
            measurementId: "G-NXGYWXR1B4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // State (Чистый старт по умолчанию)
        let projects = JSON.parse(localStorage.getItem('media_reports_data')) || [];
        let activeProjectId = localStorage.getItem('media_active_proj') || '';
        let syncCode = localStorage.getItem('minimal_sync_code_reports') || '';
        let unsubscribeFirestore = null;
        let activeTargetForUpload = null;

        // DOM Elements
        const projectsTabs = document.getElementById('projectsTabs');
        const currentProjectTitle = document.getElementById('currentProjectTitle');
        const projectStats = document.getElementById('projectStats');
        const monthsContainer = document.getElementById('monthsContainer');
        const addProjectBtn = document.getElementById('addProjectBtn');
        const deleteProjectBtn = document.getElementById('deleteProjectBtn');
        const addMonthBtn = document.getElementById('addMonthBtn');
        const globalFileInput = document.getElementById('globalFileInput');

        // Modal Elements
        const syncModal = document.getElementById('syncModal');
        const openSyncModalBtn = document.getElementById('openSyncModalBtn');
        const closeSyncModalBtn = document.getElementById('closeSyncModalBtn');
        const syncBtnLabel = document.getElementById('syncBtnLabel');
        const syncBadge = document.getElementById('syncBadge');
        const syncCodeInput = document.getElementById('syncCodeInput');
        const applySyncCodeBtn = document.getElementById('applySyncCodeBtn');
        const modalStatusText = document.getElementById('modalStatusText');

        // Save & Firestore Sync
        async function saveData() {
            localStorage.setItem('media_reports_data', JSON.stringify(projects));
            localStorage.setItem('media_active_proj', activeProjectId);

            if (syncCode) {
                try {
                    const docRef = doc(db, 'tasks', 'report_' + syncCode);
                    await setDoc(docRef, { projects: projects, updatedAt: Date.now() }, { merge: true });
                } catch (err) {
                    console.error("Ошибка сохранения в Firestore:", err);
                    modalStatusText.textContent = "Ошибка сети";
                    modalStatusText.className = "font-medium text-amber-500";
                }
            }
            render();
        }

        function subscribeToCloud(code) {
            if (!code) {
                syncBadge.classList.add('hidden');
                syncBtnLabel.textContent = 'Синхронизация';
                modalStatusText.textContent = 'Локальный режим';
                modalStatusText.className = 'font-medium text-zinc-400';
                return;
            }

            if (unsubscribeFirestore) unsubscribeFirestore();

            const docRef = doc(db, 'tasks', 'report_' + code);
            unsubscribeFirestore = onSnapshot(docRef, (docSnap) => {
                if (docSnap.exists() && docSnap.data().projects) {
                    projects = docSnap.data().projects;
                    localStorage.setItem('media_reports_data', JSON.stringify(projects));
                    render();
                } else {
                    saveData();
                }
                syncBadge.classList.remove('hidden');
                syncBtnLabel.textContent = `Код: ${code}`;
                modalStatusText.textContent = `Синхронизировано (${code})`;
                modalStatusText.className = "font-medium text-emerald-400";
            }, (error) => {
                console.error("Ошибка подписки Firestore:", error);
                modalStatusText.textContent = "Ошибка доступа к БД";
                modalStatusText.className = "font-medium text-red-500";
            });
        }

        function getActiveProject() {
            return projects.find(p => String(p.id) === String(activeProjectId)) || projects[0];
        }

        function getStatusBadge(status) {
            switch (status) {
                case 'published':
                    return `<span class="px-3 py-1 text-xs font-medium rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 flex items-center gap-1.5 w-fit">
                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span> Опубликовано
                    </span>`;
                case 'approved':
                    return `<span class="px-3 py-1 text-xs font-medium rounded-full bg-purple-500/10 text-purple-400 border border-purple-500/20 flex items-center gap-1.5 w-fit">
                        <span class="w-1.5 h-1.5 rounded-full bg-purple-400"></span> Утвержден
                    </span>`;
                default:
                    return `<span class="px-3 py-1 text-xs font-medium rounded-full bg-blue-500/10 text-blue-400 border border-blue-500/20 flex items-center gap-1.5 w-fit">
                        <span class="w-1.5 h-1.5 rounded-full bg-blue-400 animate-pulse"></span> Монтаж
                    </span>`;
            }
        }

        // Render Engine
        function render() {
            // ЭКРАН ПРИ ПУСТОМ СОСТОЯНИИ (БЕЗ ПРОЕКТОВ)
            if (!projects || projects.length === 0) {
                currentProjectTitle.textContent = "Нет проектов";
                projectStats.textContent = "Создайте новый проект или введите Синхро-код";
                monthsContainer.innerHTML = `
                    <div class="text-center py-20 border border-dashed border-zinc-800 rounded-2xl space-y-4">
                        <p class="text-zinc-400 text-sm">У вас пока нет активных листов с отчетами.</p>
                        <div class="flex items-center justify-center gap-3">
                            <button onclick="document.getElementById('addProjectBtn').click()" class="px-4 py-2.5 bg-blue-600 hover:bg-blue-500 text-white text-xs font-medium rounded-xl transition-all">
                                + Создать проект
                            </button>
                            <button onclick="document.getElementById('openSyncModalBtn').click()" class="px-4 py-2.5 bg-zinc-800 hover:bg-zinc-700 text-zinc-200 text-xs font-medium rounded-xl transition-all">
                                ☁️ Ввести Синхро-код
                            </button>
                        </div>
                    </div>
                `;
                projectsTabs.innerHTML = `<span class="text-xs text-zinc-500 italic px-2">Нет сохраненных листов</span>`;
                deleteProjectBtn.classList.add('hidden');
                addMonthBtn.classList.add('hidden');
                lucide.createIcons();
                return;
            }

            deleteProjectBtn.classList.remove('hidden');
            addMonthBtn.classList.remove('hidden');

            const activeProj = getActiveProject();
            if (!activeProj) {
                activeProjectId = projects[0].id;
                render();
                return;
            }

            activeProjectId = activeProj.id;

            // 1. Bottom Tabs
            projectsTabs.innerHTML = projects.map(p => `
                <button 
                    onclick="window.switchProject('${p.id}')"
                    class="px-4 py-2 text-xs font-medium rounded-lg transition-all whitespace-nowrap flex items-center gap-2 ${String(p.id) === String(activeProjectId) ? 'bg-blue-600 text-white shadow-md' : 'text-zinc-400 hover:text-zinc-200 hover:bg-zinc-800/60'}"
                >
                    <i data-lucide="file-text" class="w-4 h-4 opacity-70"></i>
                    <span>${escapeHtml(p.name)}</span>
                </button>
            `).join('');

            // 2. Project Header
            currentProjectTitle.textContent = activeProj.name;
            
            let totalVideos = 0;
            let publishedVideos = 0;
            activeProj.months.forEach(m => {
                totalVideos += m.items.length;
                publishedVideos += m.items.filter(i => i.status === 'published').length;
            });
            projectStats.textContent = `Всего видео: ${totalVideos} • Опубликовано: ${publishedVideos} • В процессе: ${totalVideos - publishedVideos}`;

            // 3. Months Accordion
            if (activeProj.months.length === 0) {
                monthsContainer.innerHTML = `
                    <div class="text-center py-16 border border-dashed border-zinc-800 rounded-2xl">
                        <p class="text-sm text-zinc-500">Нет добавленных месяцев. Нажмите «Добавить месяц» выше.</p>
                    </div>
                `;
            } else {
                monthsContainer.innerHTML = activeProj.months.map(m => renderMonthSection(m)).join('');
            }

            lucide.createIcons();
        }

        function renderMonthSection(month) {
            return `
                <div class="print-card bg-zinc-900/60 border border-zinc-800/80 rounded-2xl overflow-hidden transition-all shadow-sm">
                    <!-- Month Header -->
                    <div class="px-6 py-4 bg-zinc-900/90 flex items-center justify-between border-b border-zinc-800/60 select-none">
                        <div class="flex items-center gap-3 cursor-pointer" onclick="window.toggleMonth('${month.id}')">
                            <i data-lucide="chevron-down" class="w-4 h-4 text-zinc-400 transition-transform ${month.isOpen ? '' : '-rotate-90'}"></i>
                            <h3 class="font-semibold text-base text-zinc-100">${escapeHtml(month.title)}</h3>
                            <span class="text-xs px-2.5 py-0.5 rounded-full bg-zinc-800 text-zinc-400 font-mono">${month.items.length}</span>
                        </div>

                        <div class="flex items-center gap-2 no-print">
                            <button onclick="window.addVideo('${month.id}')" class="px-3.5 py-1.5 text-xs bg-zinc-800 hover:bg-zinc-700 text-zinc-200 rounded-lg transition-colors flex items-center gap-1.5">
                                <i data-lucide="plus" class="w-3.5 h-3.5"></i>
                                <span>Добавить ролик</span>
                            </button>
                            <button onclick="window.deleteMonth('${month.id}')" class="p-1.5 text-zinc-500 hover:text-red-400 transition-colors rounded-lg">
                                <i data-lucide="trash" class="w-3.5 h-3.5"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Month Items Table -->
                    <div class="${month.isOpen ? 'block' : 'hidden'} print-accordion-content p-3 sm:p-5">
                        ${month.items.length === 0 ? `
                            <div class="text-center py-8 text-xs text-zinc-500">
                                В этом месяце пока нет роликов.
                            </div>
                        ` : `
                            <div class="overflow-x-auto">
                                <table class="w-full text-left text-sm border-collapse">
                                    <thead>
                                        <tr class="text-zinc-500 border-b border-zinc-800/60 uppercase tracking-wider text-xs">
                                            <th class="py-2.5 px-3 w-10">№</th>
                                            <th class="py-2.5 px-3 w-24">Превью</th>
                                            <th class="py-2.5 px-3">Название / Тэг</th>
                                            <th class="py-2.5 px-3 w-52">Статус / Дата</th>
                                            <th class="py-2.5 px-3 w-36 no-print">Ссылка</th>
                                            <th class="py-2.5 px-3 w-12 text-right no-print"></th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-zinc-800/40">
                                        ${month.items.map((item, index) => renderVideoRow(month.id, item, index + 1)).join('')}
                                    </tbody>
                                </table>
                            </div>
                        `}
                    </div>
                </div>
            `;
        }

        function renderVideoRow(monthId, item, index) {
            const isPublished = item.status === 'published';

            return `
                <tr class="group hover:bg-zinc-800/30 transition-colors">
                    <!-- Index -->
                    <td class="py-3.5 px-3 text-zinc-500 font-mono font-medium text-xs sm:text-sm">${index}</td>

                    <!-- Drag & Drop Preview Image -->
                    <td class="py-3.5 px-3">
                        <div 
                            tabindex="0"
                            onclick="window.selectTargetForPaste('${monthId}', '${item.id}')"
                            ondragover="window.handleDragOver(event)"
                            ondragleave="window.handleDragLeave(event)"
                            ondrop="window.handleDrop(event, '${monthId}', '${item.id}')"
                            class="preview-dropzone w-16 aspect-[3/4] rounded-xl border border-zinc-800 bg-zinc-950 flex flex-col items-center justify-center cursor-pointer overflow-hidden relative group/img transition-all hover:border-blue-500/60 outline-none focus:ring-2 focus:ring-blue-500/40 shrink-0"
                            title="Перетащите фото сюда, кликните или вставьте (Ctrl+V)"
                        >
                            ${item.image ? `
                                <img src="${item.image}" class="w-full h-full object-cover">
                                <div class="absolute inset-0 bg-black/60 opacity-0 group-hover/img:opacity-100 flex flex-col items-center justify-center gap-1 transition-opacity no-print text-[10px] text-zinc-200">
                                    <i data-lucide="upload" class="w-4 h-4"></i>
                                    <span>Заменить</span>
                                </div>
                            ` : `
                                <i data-lucide="image-plus" class="w-5 h-5 text-zinc-600 group-hover/img:text-blue-400 no-print"></i>
                                <span class="text-[9px] text-zinc-600 mt-1 no-print">3:4</span>
                            `}
                        </div>
                    </td>

                    <!-- Title & Tag -->
                    <td class="py-3.5 px-3">
                        <input 
                            type="text" 
                            value="${escapeHtml(item.title)}" 
                            placeholder="Название ролика..." 
                            onchange="window.updateItem('${monthId}', '${item.id}', 'title', this.value)"
                            class="w-full bg-transparent font-medium text-sm sm:text-base text-zinc-100 outline-none focus:border-b focus:border-blue-500 py-0.5"
                        >
                        <input 
                            type="text" 
                            value="${escapeHtml(item.tag || '')}" 
                            placeholder="#тэг" 
                            onchange="window.updateItem('${monthId}', '${item.id}', 'tag', this.value)"
                            class="w-full bg-transparent text-xs text-blue-400/90 outline-none mt-1"
                        >
                    </td>

                    <!-- Status + Conditional Date -->
                    <td class="py-3.5 px-3">
                        <div class="flex flex-col gap-2">
                            <select 
                                onchange="window.updateItem('${monthId}', '${item.id}', 'status', this.value)"
                                class="bg-zinc-950 border border-zinc-800 text-xs sm:text-sm rounded-xl px-3 py-1.5 text-zinc-200 outline-none focus:border-zinc-700 cursor-pointer no-print w-fit"
                            >
                                <option value="editing" ${item.status === 'editing' ? 'selected' : ''}>🔵 Монтаж</option>
                                <option value="approved" ${item.status === 'approved' ? 'selected' : ''}>🟣 Утвержден</option>
                                <option value="published" ${item.status === 'published' ? 'selected' : ''}>🟢 Опубликовано</option>
                            </select>

                            <!-- Print Mode Badge -->
                            <div class="hidden print:block">
                                ${getStatusBadge(item.status)}
                            </div>

                            <!-- Date (Shows only if Published) -->
                            ${isPublished ? `
                                <div class="flex items-center gap-1.5 text-xs text-zinc-400 mt-0.5">
                                    <i data-lucide="calendar" class="w-3.5 h-3.5 text-emerald-400/80 no-print"></i>
                                    <input 
                                        type="date" 
                                        value="${item.date || ''}" 
                                        onchange="window.updateItem('${monthId}', '${item.id}', 'date', this.value)"
                                        class="bg-transparent text-xs text-emerald-400 outline-none focus:underline"
                                    >
                                </div>
                            ` : ''}
                        </div>
                    </td>

                    <!-- Link -->
                    <td class="py-3.5 px-3 no-print">
                        ${item.link ? `
                            <a href="${escapeHtml(item.link)}" target="_blank" class="inline-flex items-center gap-1 text-blue-400 hover:underline text-xs mb-1">
                                <i data-lucide="external-link" class="w-3.5 h-3.5"></i> Посмотреть
                            </a>
                        ` : ''}
                        <input 
                            type="url" 
                            placeholder="Ссылка..." 
                            value="${escapeHtml(item.link || '')}"
                            onchange="window.updateItem('${monthId}', '${item.id}', 'link', this.value)"
                            class="w-full bg-transparent text-xs text-zinc-500 outline-none focus:text-zinc-300"
                        >
                    </td>

                    <!-- Delete Action -->
                    <td class="py-3.5 px-3 text-right no-print">
                        <button 
                            onclick="window.deleteVideo('${monthId}', '${item.id}')"
                            class="opacity-0 group-hover:opacity-100 p-1.5 text-zinc-600 hover:text-red-400 transition-all rounded-lg"
                            title="Удалить"
                        >
                            <i data-lucide="x" class="w-4 h-4"></i>
                        </button>
                    </td>
                </tr>
            `;
        }

        // Actions
        window.switchProject = (id) => {
            activeProjectId = String(id);
            saveData();
        };

        addProjectBtn.addEventListener('click', () => {
            const name = prompt('Название нового листа (проекта):');
            if (name && name.trim()) {
                const newProj = {
                    id: 'proj_' + Date.now(),
                    name: name.trim(),
                    months: [{
                        id: 'm_' + Date.now(),
                        title: 'Октябрь 2026',
                        isOpen: true,
                        items: []
                    }]
                };
                projects.push(newProj);
                activeProjectId = newProj.id;
                saveData();
            }
        });

        deleteProjectBtn.addEventListener('click', () => {
            if (projects.length === 0) return;
            if (confirm('Вы уверены, что хотите удалить этот лист проекта?')) {
                projects = projects.filter(p => String(p.id) !== String(activeProjectId));
                activeProjectId = projects[0]?.id || '';
                saveData();
            }
        });

        addMonthBtn.addEventListener('click', () => {
            const title = prompt('Введите название месяца (например: Ноябрь 2026):');
            if (title && title.trim()) {
                const proj = getActiveProject();
                if (proj) {
                    proj.months.unshift({
                        id: 'm_' + Date.now(),
                        title: title.trim(),
                        isOpen: true,
                        items: []
                    });
                    saveData();
                }
            }
        });

        window.toggleMonth = (monthId) => {
            const proj = getActiveProject();
            if (!proj) return;
            const month = proj.months.find(m => String(m.id) === String(monthId));
            if (month) {
                month.isOpen = !month.isOpen;
                saveData();
            }
        };

        window.deleteMonth = (monthId) => {
            if (confirm('Удалить весь месяц и все ролики в нем?')) {
                const proj = getActiveProject();
                if (!proj) return;
                proj.months = proj.months.filter(m => String(m.id) !== String(monthId));
                saveData();
            }
        };

        window.addVideo = (monthId) => {
            const proj = getActiveProject();
            if (!proj) return;
            const month = proj.months.find(m => String(m.id) === String(monthId));
            if (month) {
                month.items.push({
                    id: 'item_' + Date.now(),
                    title: 'Новый ролик',
                    tag: '#рилс',
                    status: 'editing',
                    date: '',
                    link: '',
                    image: ''
                });
                saveData();
            }
        };

        window.updateItem = (monthId, itemId, key, value) => {
            const proj = getActiveProject();
            if (!proj) return;
            const month = proj.months.find(m => String(m.id) === String(monthId));
            if (month) {
                const item = month.items.find(i => String(i.id) === String(itemId));
                if (item) {
                    item[key] = value;
                    if (key === 'status' && value === 'published' && !item.date) {
                        item.date = new Date().toISOString().split('T')[0];
                    }
                    saveData();
                }
            }
        };

        window.deleteVideo = (monthId, itemId) => {
            const proj = getActiveProject();
            if (!proj) return;
            const month = proj.months.find(m => String(m.id) === String(monthId));
            if (month) {
                month.items = month.items.filter(i => String(i.id) !== String(itemId));
                saveData();
            }
        };

        // Drag & Drop + Clipboard Upload
        window.selectTargetForPaste = (monthId, itemId) => {
            activeTargetForUpload = { monthId, itemId };
            triggerImageUpload(monthId, itemId);
        };

        function triggerImageUpload(monthId, itemId) {
            activeTargetForUpload = { monthId, itemId };
            globalFileInput.click();
        }

        globalFileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file && activeTargetForUpload) {
                processFile(file, activeTargetForUpload.monthId, activeTargetForUpload.itemId);
            }
        });

        window.handleDragOver = (e) => {
            e.preventDefault();
            e.currentTarget.classList.add('drag-over');
        };

        window.handleDragLeave = (e) => {
            e.currentTarget.classList.remove('drag-over');
        };

        window.handleDrop = (e, monthId, itemId) => {
            e.preventDefault();
            e.currentTarget.classList.remove('drag-over');
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) {
                processFile(file, monthId, itemId);
            }
        };

        window.addEventListener('paste', (e) => {
            const items = (e.clipboardData || e.originalEvent.clipboardData).items;
            for (let item of items) {
                if (item.type.indexOf('image') !== -1) {
                    const file = item.getAsFile();
                    if (activeTargetForUpload) {
                        processFile(file, activeTargetForUpload.monthId, activeTargetForUpload.itemId);
                    } else {
                        alert('Сначала кликните по блоку превью ролика, куда хотите вставить фото.');
                    }
                    break;
                }
            }
        });

        function processFile(file, monthId, itemId) {
            const reader = new FileReader();
            reader.onload = (event) => {
                updateItem(monthId, itemId, 'image', event.target.result);
                activeTargetForUpload = null;
                globalFileInput.value = '';
            };
            reader.readAsDataURL(file);
        }

        function escapeHtml(str) {
            return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }

        // Modal Handlers
        openSyncModalBtn.addEventListener('click', () => {
            syncCodeInput.value = syncCode;
            syncModal.classList.remove('opacity-0', 'pointer-events-none');
        });

        closeSyncModalBtn.addEventListener('click', () => {
            syncModal.classList.add('opacity-0', 'pointer-events-none');
        });

        applySyncCodeBtn.addEventListener('click', () => {
            const code = syncCodeInput.value.trim();
            if (code) {
                syncCode = code;
                localStorage.setItem('minimal_sync_code_reports', code);
                subscribeToCloud(code);
                syncModal.classList.add('opacity-0', 'pointer-events-none');
            }
        });

        // Initialize
        render();
        if (syncCode) {
            subscribeToCloud(syncCode);
        }
    </script>

    <!-- Регистрация SW для PWA -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then(reg => console.log('SW зарегистрирован:', reg))
            .catch(err => console.error('Ошибка SW:', err));
        });
      }
    </script>
</body>
</html>
